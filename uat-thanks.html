<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Thanks for testing</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
  *{box-sizing:border-box;margin:0;padding:0;}
  body{
    font-family:'Manrope',-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    min-height:100vh;display:flex;align-items:center;justify-content:center;
    background:linear-gradient(135deg,#f1ecfd,#e7edff);
    padding:24px;color:#211C33;
  }
  .card{
    background:rgba(255,255,255,.85);backdrop-filter:blur(14px);
    border:1px solid #e4e3ec;border-radius:22px;max-width:440px;width:100%;
    padding:36px 32px;text-align:center;box-shadow:0 20px 50px rgba(26,21,35,.12);
  }
  .rock{width:56px;height:56px;border-radius:50%;object-fit:cover;margin:0 auto 16px;display:block;}
  h1{font-size:24px;font-weight:800;letter-spacing:-.02em;}
  p{font-size:14px;color:#6b6b7e;margin-top:10px;line-height:1.5;}
  .earned{
    display:inline-flex;align-items:center;gap:8px;margin:20px 0;font-size:15px;font-weight:800;
    color:#8a6a15;background:linear-gradient(135deg,#fff7e6,#fdeecb);border:1px solid #f4e2b0;
    border-radius:12px;padding:10px 16px;
  }
  .earned img{width:18px;height:18px;border-radius:50%;object-fit:cover;}
  a.btn{
    display:inline-block;margin-top:6px;background:#3E2472;color:#fff;text-decoration:none;
    border-radius:999px;padding:13px 28px;font-weight:800;font-size:13.5px;
    box-shadow:0 6px 16px rgba(56,33,95,.28);
  }
  a.btn:hover{background:#2e1a55;}
</style>
</head>
<body>
  <div class="card">
    <img class="rock" src="moon-logo.png" alt="">
    <h1>Thanks for testing!</h1>
    <p>Your feedback on the Sales Designer App training helps make it better for everyone.</p>
    <div class="earned"><img src="moon-logo.png" alt=""> +10 moon rocks earned</div>
    <p>Head back to your dashboard to see them added to your closet.</p>
    <a class="btn" href="/">Back to dashboard</a>
  </div>
</body>
</html>
