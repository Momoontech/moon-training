<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quiz 1: Set up and Measure</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--primary:#6C5CE7;--primary-dark:#5b4ed8;--ink:#1A1A2E;--muted:#6b6b80;--line:#E6E6EE;--bg:#F4F4F8;--card:#fff;--green:#00B894;--red:#E0553D;--gold:#FDA45B;}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Manrope',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink);line-height:1.5;padding:0 0 60px;overflow-x:hidden;}
.top{background:linear-gradient(135deg,#2A2140,var(--primary));color:#fff;padding:26px 28px;text-align:center;}
.top .k{font-size:11px;letter-spacing:.16em;text-transform:uppercase;opacity:.8;}
.top h1{font-size:25px;font-weight:800;margin-top:5px;}.top p{font-size:13.5px;opacity:.9;margin-top:5px;}
.wrap{max-width:640px;margin:0 auto;padding:0 20px;}
.quizbox{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:26px;margin-top:22px;box-shadow:0 4px 16px rgba(42,33,64,.05);}
.lead{font-size:14px;color:var(--muted);margin-bottom:16px;}
.scorebar{display:flex;justify-content:space-between;align-items:center;font-size:13px;font-weight:700;color:var(--muted);margin-bottom:8px;}
.scorebar .streak{color:var(--gold);}
.qprog{font-size:12px;color:var(--muted);margin-bottom:8px;}
.barwrap{height:7px;background:var(--bg);border-radius:99px;overflow:hidden;margin-bottom:18px;}
.barwrap i{display:block;height:100%;background:var(--primary);transition:width .3s;}
.qq{font-size:19px;font-weight:700;margin-bottom:16px;}
.opt{display:block;width:100%;text-align:left;border:1.5px solid var(--line);background:var(--card);border-radius:12px;padding:13px 16px;font-family:inherit;font-size:14.5px;cursor:pointer;margin-bottom:10px;transition:.12s;}
.opt:hover{border-color:var(--primary);}
.opt.correct{background:#e6f8f2;border-color:var(--green);color:#0b6b52;font-weight:700;}
.opt.wrong{background:#fbe4e0;border-color:var(--red);color:#8f2a17;}
.opt.dim{opacity:.5;}
.exp{background:#f4f2ff;border-left:4px solid var(--primary);border-radius:8px;padding:12px 14px;margin-top:14px;font-size:14px;color:#3f3a63;}
.react{font-size:16px;font-weight:800;margin-bottom:6px;}.react.ok{color:var(--green);}.react.no{color:var(--red);}
.btn{border:none;border-radius:999px;padding:11px 22px;font-family:inherit;font-size:14px;font-weight:700;cursor:pointer;background:var(--primary);color:#fff;margin-top:16px;}
.result{text-align:center;padding:14px 0;}.result .score{font-size:48px;font-weight:800;color:var(--primary);}.result p{color:var(--muted);margin:10px 0 18px;}
.confetti{position:fixed;top:-12px;width:10px;height:14px;z-index:99;border-radius:2px;animation:fall linear forwards;}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg);}}
</style></head>
<body>
<div class="top"><div class="k">Sales Designer App Training</div><h1>Quiz 1: Set up and Measure</h1><p>Configure a room and measure it.</p></div>
<div class="wrap"><div class="quizbox" id="box"></div></div>
<script>
(function(){
var QUIZ=[{"q": "Why does every appointment start with the Plan step?", "opts": ["To capture what the client needs, so the design fits them", "To lock in the client's budget before you design", "To choose the room shape and begin measuring"], "a": 0, "exp": "Plan is about understanding the client and their space. Budget talk and room shape come later."}, {"q": "What is the point of the Agenda step?", "opts": ["To set expectations and build rapport with the client", "To record the room's measurements", "To review the final quote together"], "a": 0, "exp": "Agenda sets expectations for the visit and builds rapport. Measuring and the quote come later."}, {"q": "What do you do first before you can start measuring the room?", "opts": ["Pick the closest room shape to the real room", "Plot the walls on a blank floor plan", "Set the wall heights and finishes"], "a": 0, "exp": "You start from a room shape, then refine walls. You do not measure onto a blank canvas."}, {"q": "Why choose the closest room shape up front?", "opts": ["Changing it later restarts the room and loses your work", "The shape locks the pricing tier for the room", "You can't switch views until a shape is chosen"], "a": 0, "exp": "A shape change restarts the room, so pick the closest match first. It does not set pricing or views."}, {"q": "How do you set a wall's exact measurement on the Floor Plan?", "opts": ["Tap the measurement value and type it, or edit it in the wall's property panel", "Drag the wall until it looks about right", "It's set automatically and can't be changed"], "a": 0, "exp": "Tap the measurement input and type the value, or tap the wall and update it in the property panel."}, {"q": "A door sits where cabinets would normally go. What should you do?", "opts": ["Add the door as an obstacle so the design works around it", "Shrink the wall so the door falls outside the room", "Leave a gap and remember it at install"], "a": 0, "exp": "Obstacles snap to the walls and keep the design true to the room, no guesswork at install."}, {"q": "Why switch to the 3D view while working?", "opts": ["To show the client a realistic view of the room and design", "Because it's the only view where you can add obstacles", "To finalize and lock the measurements"], "a": 0, "exp": "3D is for seeing the space realistically. You can edit and add obstacles in the other views too."}, {"q": "What does dragging a corner point do?", "opts": ["Moves the corner to reshape the room and update the wall measurement", "Adds a new run of shelving at that corner", "Curves the wall into a rounded shape"], "a": 0, "exp": "Dragging a corner moves it, reshaping the room and updating that wall's measurement. It does not curve the wall."}, {"q": "A home has two closets in different rooms to design. How does the app handle that?", "opts": ["Each room is tracked separately with its own progress", "You finish one, then duplicate it for the second", "Both rooms share one combined floor plan"], "a": 0, "exp": "Rooms are tracked separately and resume where you left off, not duplicated or merged."}, {"q": "You can't find a specific obstacle in the list. What's the fastest way to add it?", "opts": ["Use the search in the obstacle picker", "Scroll through every category", "Add it by hand after install"], "a": 0, "exp": "The obstacle picker has search / auto-complete, so you can type the item and add it fast."}];
var box=document.getElementById('box'), order=[], qi=0, score=0, streak=0, answered=false;
function shuffle(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
function prep(){
  order=QUIZ.map(function(it){
    var idx=shuffle(it.opts.map(function(_,i){return i;}));
    return {q:it.q, opts:idx.map(function(i){return it.opts[i];}), a:idx.indexOf(it.a), exp:it.exp};
  });
  shuffle(order);
}
function start(){
  box.innerHTML='<div class="lead">Configure a room and measure it. '+QUIZ.length+' questions. Order is shuffled each time.</div><button class="btn" id="go">Start quiz</button>';
  document.getElementById('go').addEventListener('click',function(){prep();qi=0;score=0;streak=0;render();});
}
function render(){
  answered=false;
  if(qi>=order.length){return results();}
  var it=order[qi];
  var sc='<div class="scorebar"><span>Score '+score+' / '+order.length+'</span>'+(streak>1?'<span class="streak">&#128293; '+streak+' streak</span>':'<span></span>')+'</div>';
  box.innerHTML=sc+'<div class="qprog">Question '+(qi+1)+' of '+order.length+'</div><div class="barwrap"><i style="width:'+(qi/order.length*100)+'%"></i></div><div class="qq">'+it.q+'</div>'+
    it.opts.map(function(o,i){return '<button class="opt" data-i="'+i+'">'+o+'</button>';}).join('')+'<div id="after"></div>';
  [].slice.call(box.querySelectorAll('.opt')).forEach(function(btn){
    btn.addEventListener('click',function(){
      if(answered)return; answered=true;
      var chosen=+btn.dataset.i, correct=it.a;
      [].slice.call(box.querySelectorAll('.opt')).forEach(function(b,i){b.style.pointerEvents='none';if(i===correct)b.classList.add('correct');else b.classList.add('wrong');});
      if(chosen===correct){score++;streak++;}else{streak=0;}
      var last=(qi===order.length-1);
      var fun=['🎯 Bullseye!','🧩 Bingo!','🚀 On the right track!','🏠 Home run!','🌟 One step closer to mastery.','💪 Measuring up already.','👏 Nailed it.','🔨 Solid foundation.','✨ Spot on.','🙌 You got it.','👌 Chef\u2019s kiss.','⭐ Too easy.','🎉 Correct!','😎 Keep the streak alive.'];var react=chosen===correct?(streak>=4?'\ud83d\udd25 Unstoppable!':streak===3?'\ud83d\udd25 Hat trick!':fun[Math.floor(Math.random()*fun.length)]):'Not quite\u2026';document.getElementById('after').innerHTML='<div class="react '+(chosen===correct?'ok':'no')+'">'+react+'</div><div class="exp">'+it.exp+'</div><button class="btn" id="nx">'+(last?'See results':'Next')+'</button>';
      document.getElementById('nx').addEventListener('click',function(){qi++;render();});
    });
  });
}
function results(){
  var perfect=(score===order.length);
  var msg=perfect?"Perfect. You know the app cold.":score>=Math.ceil(order.length*0.7)?"Strong. A quick review and you are set.":"Good start, worth another run.";
  box.innerHTML='<div class="result"><div class="score">'+score+' / '+order.length+'</div><p>'+msg+'</p><button class="btn" id="again">Try again</button></div>';
  document.getElementById('again').addEventListener('click',function(){prep();qi=0;score=0;streak=0;render();});
  if(perfect)confetti();
}
function confetti(){
  var cols=['#6C5CE7','#00B894','#FDA45B','#E0553D','#2A2140'];
  for(var i=0;i<60;i++){(function(){var d=document.createElement('div');d.className='confetti';d.style.left=Math.random()*100+'vw';d.style.background=cols[i%cols.length];d.style.animationDuration=(1.6+Math.random()*1.6)+'s';d.style.animationDelay=(Math.random()*0.4)+'s';document.body.appendChild(d);setTimeout(function(){d.remove();},3600);})();}
}
prep();render();
})();
</script></body></html>
