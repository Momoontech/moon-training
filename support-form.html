<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Support</title>
<style>
  :root{
    --primary:#734e94;
    --color-button-primary:#42275a;
    --ink:#1a181b;
    --muted:#76717a;
    --line:#e7e5e9;
    --primary-soft:#f1e2ff;
    --bg:#faf9fb;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:'Manrope',-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink);line-height:1.5;}
  .wrap{max-width:520px;margin:0 auto;padding:40px 24px 60px;}
  .k{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--primary);font-weight:700;}
  h1{font-size:26px;font-weight:800;margin-top:8px;}
  .lead{color:var(--muted);font-size:14px;margin-top:10px;}
  form{margin-top:28px;}
  label{display:block;font-size:12.5px;font-weight:700;color:var(--muted);margin-bottom:8px;}
  textarea{width:100%;min-height:160px;border:1px solid var(--line);border-radius:14px;padding:14px 16px;font-family:inherit;font-size:14px;color:var(--ink);resize:vertical;outline:none;}
  textarea:focus{border-color:var(--primary);}
  .submit{margin-top:18px;width:100%;background:var(--color-button-primary);color:#fff;border:none;border-radius:14px;padding:15px;font-family:inherit;font-size:14.5px;font-weight:700;cursor:pointer;}
  .submit:hover{opacity:.92;}
  .confirm{text-align:center;padding:60px 18px;}
  .confirm .emoji{font-size:40px;}
  .confirm h2{font-size:18px;font-weight:800;margin-top:14px;}
  .confirm p{color:var(--muted);font-size:13px;margin-top:8px;max-width:340px;margin-left:auto;margin-right:auto;}
</style>
</head>
<body>
  <div class="wrap" id="wrap">
    <span class="k">Help &middot; Support</span>
    <h1>Submit a request</h1>
    <p class="lead">There are no live agents right now, so a real person isn't standing by - expect a response within 24 hours.</p>
    <form id="supportForm">
      <label for="supportText">Describe the issue</label>
      <textarea id="supportText" placeholder="What's going on?"></textarea>
      <button type="submit" class="submit">Submit ticket</button>
    </form>
  </div>
  <script>
    document.getElementById('supportForm').addEventListener('submit', function(e){
      e.preventDefault();
      var text = document.getElementById('supportText').value.trim();
      if(!text) return;
      document.getElementById('wrap').innerHTML =
        '<div class="confirm"><div class="emoji">✅</div>' +
        '<h2>Ticket submitted</h2>' +
        '<p>Expect a response within 24 hours. (This is a preview - tickets aren\'t sent anywhere yet.)</p></div>';
    });
  </script>
</body>
</html>
