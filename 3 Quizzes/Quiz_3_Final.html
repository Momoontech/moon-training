<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Final Quiz: the whole flow</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--primary:#6C5CE7;--primary-dark:#5b4ed8;--ink:#1A1A2E;--muted:#6b6b80;--line:#E6E6EE;--bg:#F4F4F8;--card:#fff;--green:#00B894;--red:#E0553D;--gold:#FDA45B;}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Manrope',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink);line-height:1.5;padding:0 0 60px;overflow-x:hidden;}
.top{background:linear-gradient(135deg,#2A2140,var(--primary));color:#fff;padding:26px 28px;text-align:center;}
.top .k{font-size:11px;letter-spacing:.16em;text-transform:uppercase;opacity:.8;}
.top h1{font-size:25px;font-weight:800;margin-top:5px;}.top p{font-size:13.5px;opacity:.9;margin-top:5px;}
.wrap{max-width:640px;margin:0 auto;padding:0 20px;}
.quizbox{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:26px;margin-top:22px;box-shadow:0 4px 16px rgba(42,33,64,.05);}
.lead{font-size:14px;color:var(--muted);margin-bottom:16px;}
.scorebar{display:flex;justify-content:space-between;align-items:center;font-size:13px;font-weight:700;color:var(--muted);margin-bottom:8px;}
.scorebar .streak{color:var(--gold);}
.qprog{font-size:12px;color:var(--muted);margin-bottom:8px;}
.barwrap{height:7px;background:var(--bg);border-radius:99px;overflow:hidden;margin-bottom:18px;}
.barwrap i{display:block;height:100%;background:var(--primary);transition:width .3s;}
.qq{font-size:19px;font-weight:700;margin-bottom:16px;}
.opt{display:block;width:100%;text-align:left;border:1.5px solid var(--line);background:var(--card);border-radius:12px;padding:13px 16px;font-family:inherit;font-size:14.5px;cursor:pointer;margin-bottom:10px;transition:.12s;}
.opt:hover{border-color:var(--primary);}
.opt.correct{background:#e6f8f2;border-color:var(--green);color:#0b6b52;font-weight:700;}
.opt.wrong{background:#fbe4e0;border-color:var(--red);color:#8f2a17;}
.opt.dim{opacity:.5;}
.exp{background:#f4f2ff;border-left:4px solid var(--primary);border-radius:8px;padding:12px 14px;margin-top:14px;font-size:14px;color:#3f3a63;}
.react{font-size:16px;font-weight:800;margin-bottom:6px;}.react.ok{color:var(--green);}.react.no{color:var(--red);}
.btn{border:none;border-radius:999px;padding:11px 22px;font-family:inherit;font-size:14px;font-weight:700;cursor:pointer;background:var(--primary);color:#fff;margin-top:16px;}
.result{text-align:center;padding:14px 0;}.result .score{font-size:48px;font-weight:800;color:var(--primary);}.result p{color:var(--muted);margin:10px 0 18px;}
.confetti{position:fixed;top:-12px;width:10px;height:14px;z-index:99;border-radius:2px;animation:fall linear forwards;}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg);}}
</style></head>
<body>
<div class="top"><div class="k">Sales Designer App Training</div><h1>Final Quiz: the whole flow</h1><p>Plan to Handoff, the full appointment.</p></div>
<div class="wrap"><div class="quizbox" id="box"></div></div>
<script>
(function(){
var QUIZ=[{"q": "Why does every appointment begin with Plan?", "opts": ["To capture the client and their needs before building anything", "To set the appointment's price ceiling", "To choose the room shape"], "a": 0, "exp": "Plan grounds the visit in the client's needs. Shape and pricing come later."}, {"q": "What is the Agenda step for?", "opts": ["Setting expectations for how the visit will run", "Entering the room measurements", "Selecting finishes and colors"], "a": 0, "exp": "Agenda aligns you and the client on the plan and pace."}, {"q": "What must happen before you can start measuring the room?", "opts": ["Pick the closest room shape to the real room", "Plot the walls on a blank canvas", "Add the doors and windows"], "a": 0, "exp": "The room shape is the starting point everything else builds on."}, {"q": "Why choose the closest room shape first?", "opts": ["Changing it later restarts the room", "It sets the room's pricing tier", "It unlocks the 3D view"], "a": 0, "exp": "A shape change restarts the room, so getting close up front avoids rework."}, {"q": "Why measure the walls accurately?", "opts": ["So the finished closet fits the client's actual space", "So the app can auto-generate the price", "Because walls can't be changed afterward"], "a": 0, "exp": "The design is only as good as the measurements it sits on, and walls stay editable."}, {"q": "A window sits where you'd place shelving. What do you do?", "opts": ["Add it as an obstacle so the design accounts for it", "Shrink the wall to exclude the window", "Note it and adjust at install"], "a": 0, "exp": "Obstacles snap to the walls and keep the design honest to the real room."}, {"q": "Why switch to the 3D view during the appointment?", "opts": ["To show the client the space and design realistically", "Because it's the only view that can add obstacles", "To lock the measurements in place"], "a": 0, "exp": "3D helps the client picture the result; it isn't required to add obstacles or lock measurements."}, {"q": "On the Estimate, how do you take a room off the current quote without deleting its design?", "opts": ["Tap \"Save for Later\" on that line item", "Delete it from the Floor Plan", "Drag it off the screen"], "a": 0, "exp": "\"Save for Later\" moves a room off the current estimate while keeping its design."}, {"q": "Why must the room's structure exist before you add sections from the catalog?", "opts": ["To ensure the proper measurements and design are in place, so the final product fits the space as expected", "The catalog is hidden until the pricing step", "Sections cost more without a structure"], "a": 0, "exp": "You build the structure first so the sections you add fit the real room."}, {"q": "The client wants a different door color. How do you change it?", "opts": ["Tap the section and change its finish in Customize", "Change it in Accessorize", "Change it on the Estimate"], "a": 0, "exp": "Finishes and colors are changed in Customize (under Present)."}, {"q": "How do you add an accessory like a tie rack to the closet?", "opts": ["Access the Accessorize substep and add it to the design", "Add it in Customize", "Add it on the Estimate"], "a": 0, "exp": "Accessories are added in the Accessorize substep, under Present."}, {"q": "What does the Finishing Touches step cover?", "opts": ["Job details like tear out and disposal, per room", "Final finish and color selection", "Generating the client's documents"], "a": 0, "exp": "Finishing Touches is job logistics per room, not finishes or the handoff documents."}, {"q": "From the Estimate, how do you jump back into a room's design to change it?", "opts": ["Tap the edit (pencil) icon on that line item", "Tap Back until you reach it", "Start the room over"], "a": 0, "exp": "Each line item on the Estimate has an edit (pencil) icon that takes you back into that room's design."}, {"q": "Where does the client choose Pay Now, Finance, or Layaway?", "opts": ["In Payment Terms on the Estimate", "On the Handoff documents", "In Finishing Touches"], "a": 0, "exp": "Payment Terms on the Estimate is where Pay Now, Finance, and Layaway are chosen."}, {"q": "You close the app in the middle of an appointment. What happens when you come back to that room?", "opts": ["It resumes right where you left off", "It starts the room over from scratch", "Your design is lost"], "a": 0, "exp": "Each room keeps its own progress, so you can step away and pick up exactly where you were."}, {"q": "Why is it useful that Back always works?", "opts": ["You can revisit any step without losing your place", "It resets the current step to defaults", "It's the only way to change the price"], "a": 0, "exp": "Back lets you adjust freely as the client reacts, without losing progress."}, {"q": "Why does Continue complete a step before unlocking the next?", "opts": ["It guides you through the appointment in the right order", "It permanently locks the previous step", "It lets you skip steps you don't need"], "a": 0, "exp": "Completing each step in order keeps the appointment on track. You can still go Back anytime."}, {"q": "You need to start the second closet in the same home. How do you switch to it?", "opts": ["Add the room if it isn't there yet, then pick it from the room selector", "Start a whole new appointment", "Duplicate the first room"], "a": 0, "exp": "You switch rooms from the room selector. If the room hasn't been added yet, add it first."}, {"q": "What is the last thing you do for the client?", "opts": ["Have them sign, and the documents are emailed to them", "Re-measure the room to confirm", "Email the design to the office"], "a": 0, "exp": "After the client signs, the documents are sent to them by email."}, {"q": "Big picture: what is the whole flow designed to do?", "opts": ["Turn a real room into a design and a clear quote the client trusts", "Collect the client's measurements for the office", "Generate a price as fast as possible"], "a": 0, "exp": "Every step moves from understanding the room to a design and a quote the client believes in."}];
var box=document.getElementById('box'), order=[], qi=0, score=0, streak=0, answered=false;
function shuffle(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
function prep(){
  order=QUIZ.map(function(it){
    var idx=shuffle(it.opts.map(function(_,i){return i;}));
    return {q:it.q, opts:idx.map(function(i){return it.opts[i];}), a:idx.indexOf(it.a), exp:it.exp};
  });
  shuffle(order);
}
function start(){
  box.innerHTML='<div class="lead">Plan to Handoff, the full appointment. '+QUIZ.length+' questions. Order is shuffled each time.</div><button class="btn" id="go">Start quiz</button>';
  document.getElementById('go').addEventListener('click',function(){prep();qi=0;score=0;streak=0;render();});
}
function render(){
  answered=false;
  if(qi>=order.length){return results();}
  var it=order[qi];
  var sc='<div class="scorebar"><span>Score '+score+' / '+order.length+'</span>'+(streak>1?'<span class="streak">&#128293; '+streak+' streak</span>':'<span></span>')+'</div>';
  box.innerHTML=sc+'<div class="qprog">Question '+(qi+1)+' of '+order.length+'</div><div class="barwrap"><i style="width:'+(qi/order.length*100)+'%"></i></div><div class="qq">'+it.q+'</div>'+
    it.opts.map(function(o,i){return '<button class="opt" data-i="'+i+'">'+o+'</button>';}).join('')+'<div id="after"></div>';
  [].slice.call(box.querySelectorAll('.opt')).forEach(function(btn){
    btn.addEventListener('click',function(){
      if(answered)return; answered=true;
      var chosen=+btn.dataset.i, correct=it.a;
      [].slice.call(box.querySelectorAll('.opt')).forEach(function(b,i){b.style.pointerEvents='none';if(i===correct)b.classList.add('correct');else b.classList.add('wrong');});
      if(chosen===correct){score++;streak++;}else{streak=0;}
      var last=(qi===order.length-1);
      var fun=['🎯 Bullseye!','🧩 Bingo!','🚀 On the right track!','🏠 Home run!','🌟 One step closer to mastery.','💪 Measuring up already.','👏 Nailed it.','🔨 Solid foundation.','✨ Spot on.','🙌 You got it.','👌 Chef\u2019s kiss.','⭐ Too easy.','🎉 Correct!','😎 Keep the streak alive.'];var react=chosen===correct?(streak>=4?'\ud83d\udd25 Unstoppable!':streak===3?'\ud83d\udd25 Hat trick!':fun[Math.floor(Math.random()*fun.length)]):'Not quite\u2026';document.getElementById('after').innerHTML='<div class="react '+(chosen===correct?'ok':'no')+'">'+react+'</div><div class="exp">'+it.exp+'</div><button class="btn" id="nx">'+(last?'See results':'Next')+'</button>';
      document.getElementById('nx').addEventListener('click',function(){qi++;render();});
    });
  });
}
function results(){
  var perfect=(score===order.length);
  var msg=perfect?"Perfect. You know the app cold.":score>=Math.ceil(order.length*0.7)?"Strong. A quick review and you are set.":"Good start, worth another run.";
  box.innerHTML='<div class="result"><div class="score">'+score+' / '+order.length+'</div><p>'+msg+'</p><button class="btn" id="again">Try again</button></div>';
  document.getElementById('again').addEventListener('click',function(){prep();qi=0;score=0;streak=0;render();});
  if(perfect)confetti();
}
function confetti(){
  var cols=['#6C5CE7','#00B894','#FDA45B','#E0553D','#2A2140'];
  for(var i=0;i<60;i++){(function(){var d=document.createElement('div');d.className='confetti';d.style.left=Math.random()*100+'vw';d.style.background=cols[i%cols.length];d.style.animationDuration=(1.6+Math.random()*1.6)+'s';d.style.animationDelay=(Math.random()*0.4)+'s';document.body.appendChild(d);setTimeout(function(){d.remove();},3600);})();}
}
prep();render();
})();
</script></body></html>
